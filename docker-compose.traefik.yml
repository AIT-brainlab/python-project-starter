# Traefik reverse proxy overlay for deployment in dev/stg/prod.
# Enable by setting in the target environment's .env file:
#   COMPOSE_FILE=docker-compose.yml:docker-compose.traefik.yml
#
services:
  app:
    networks:
      - default
      - traefik_public
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.${PROJECT_NAME}.rule=Host(`${APP_HOSTNAME_DOMAIN}`)"
      - "traefik.http.routers.${PROJECT_NAME}.entrypoints=websecure"
      - "traefik.http.routers.${PROJECT_NAME}.tls.certresolver=letsencrypt"
      - "traefik.http.services.${PROJECT_NAME}.loadbalancer.server.port=8000"

networks:
  traefik_public:
    external: true
