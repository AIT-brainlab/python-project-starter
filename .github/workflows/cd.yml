name: 🚀 Deployment

# One workflow, three environments (dev, stg, production).
# Manually triggered via workflow_dispatch.
on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to deploy to."
        type: choice
        required: true
        options:
          - dev
          - stg
          - production

permissions:
  contents: read

jobs:
  resolve:
    name: 🧭 Resolve the target environment
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.map.outputs.environment }}
    steps:
      - name: Map the target environment
        id: map
        run: |
          TARGET="${{ inputs.environment }}"
          echo "environment=$TARGET" >> "$GITHUB_OUTPUT"
          echo "Target environment: **$TARGET** (from \`${{ github.ref }}\`, commit \`${{ github.sha }}\`)" >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: 🚀 Deploy to ${{ needs.resolve.outputs.environment }}
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: ${{ needs.resolve.outputs.environment }}
      url: ${{ steps.record.outputs.url }}
    # One deployment per environment at a time: a newer run waits; it never cancels a running
    # deployment or rollback.
    concurrency:
      group: cd-${{ needs.resolve.outputs.environment }}
      cancel-in-progress: false

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: 🔍 Validate Deployment Secrets & Variables
        uses: ./.github/actions/preflight-check
        with:
          environment: ${{ needs.resolve.outputs.environment }}
          netbird-setup-key: ${{ secrets.NETBIRD_SETUP_KEY }}
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
          netbird-management-url: ${{ vars.NETBIRD_MANAGEMENT_URL }}
          server-host: ${{ vars.SERVER_HOST }}
          server-user: ${{ vars.SERVER_USER }}
          server-project-dir: ${{ vars.SERVER_PROJECT_DIR }}

      - name: 🛡️ Verify Sensitive Data Guard
        run: |
          if [ -f "scripts/check-data-guard.sh" ]; then
            bash scripts/check-data-guard.sh
          fi

      - name: 🐳 Validate Docker Compose Configuration
        run: |
          if [ -f "docker-compose.yml" ]; then
            cp .env.example .env 2>/dev/null || true
            docker compose config --quiet
            rm -f .env
          fi

      - name: 🌐 Connect to NetBird VPN Mesh
        uses: ./.github/actions/netbird-connect
        with:
          management-url: ${{ vars.NETBIRD_MANAGEMENT_URL }}
          setup-key: ${{ secrets.NETBIRD_SETUP_KEY }}
          server-host: ${{ vars.SERVER_HOST }}

      - name: 🔑 Setup SSH Authentication
        uses: ./.github/actions/ssh-setup
        with:
          ssh-key: ${{ secrets.SSH_PRIVATE_KEY }}
          server-host: ${{ vars.SERVER_HOST }}

      - name: 🚀 Update Repository and Deploy via SSH
        uses: ./.github/actions/ssh-exec
        with:
          server-host: ${{ vars.SERVER_HOST }}
          server-user: ${{ vars.SERVER_USER }}
          cmd: |
            set -e
            AUTH_REPO="https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
            TARGET_DIR="${{ vars.SERVER_PROJECT_DIR }}"

            # First deployment: the directory may already hold the hand-made .env, so the
            # checkout is initialised in place instead of cloned into an empty directory.
            if [ ! -d "$TARGET_DIR/.git" ]; then
              echo "First deployment: preparing $TARGET_DIR (an existing .env is kept)..."
              sudo mkdir -p "$TARGET_DIR"
              sudo chown -R "$(id -u):$(id -g)" "$TARGET_DIR"
              git -C "$TARGET_DIR" init -q
              git -C "$TARGET_DIR" remote add origin "$AUTH_REPO"
            fi

            cd "$TARGET_DIR"
            git remote set-url origin "$AUTH_REPO"
            git fetch -q origin --tags

            # 1. The last verified deployment on this host: a commit. None on a first deployment.
            STABLE_REV="$(cat .deploy_success 2>/dev/null || true)"
            if [ -z "$STABLE_REV" ]; then
              STABLE_REV="$(git rev-parse -q --verify HEAD 2>/dev/null || true)"
            fi
            echo "Last verified deployment on this host: ${STABLE_REV:-none (first deployment)}"

            echo "Checking out ${{ github.ref_name }} (${{ github.sha }})..."
            git checkout -q -f ${{ github.sha }}

            echo "Running deployment and smoke tests..."
            if ! bash scripts/deploy.sh; then
              echo "=========================================================="
              echo "🚨 DEPLOYMENT OR SMOKE TEST FAILED!"
              if [ -z "$STABLE_REV" ]; then
                echo "This was the first deployment on this host: there is nothing to roll back to."
                echo "=========================================================="
                exit 1
              fi
              echo "Rolling back to the last verified deployment: ${STABLE_REV}"
              echo "=========================================================="
              git checkout -q -f "${STABLE_REV}"
              bash scripts/deploy.sh
              echo "✅ Rollback to ${STABLE_REV} complete. Server restored to the last verified deployment."
              echo "Failing workflow per Fail Forward policy."
              exit 1
            fi

            # 2. Only record the new commit AFTER deploy.sh and the smoke test SUCCEED
            echo "${{ github.sha }}" > .deploy_success
            echo "✅ Deployment verified! Recorded ${{ github.ref_name }} (${{ github.sha }}) as the new stable baseline."

      - name: 🔗 Record the environment URL
        id: record
        env:
          SERVER_HOST: ${{ vars.SERVER_HOST }}
        run: echo "url=http://${SERVER_HOST}:${FASTAPI_PORT:-8000}" >> "$GITHUB_OUTPUT"
