name: CI

on:
  push:
    branches:
      - dev
      - stg
      - main
  pull_request:
    branches:
      - dev
      - stg
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Run tests
        env:
          PROJECT_NAME: python-project-starter
          BUILD_VERSION: 0.1.0-ci
          LOG_DIR: logs/
          LOG_NAME: test.log
          LOG_ROTATE_NAME: test_rotate.log
          FASTAPI_HOST: 0.0.0.0
          FASTAPI_PORT: 8000
          FASTAPI_WORKERS: 1
          REDIS_URL: redis://localhost:6379/0
        run: uv run pytest
