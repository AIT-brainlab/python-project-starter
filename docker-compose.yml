# Base compose stack for python-project-starter (Application + Redis)
# Works identically for local development, docker compose CLI, and remote deployment.

name: ${PROJECT_NAME}

services:
  redis:
    image: redis:7-alpine
    container_name: ${PROJECT_NAME}-redis
    command: redis-server --save 20 1 --loglevel warning --requirepass ${REDIS_PASSWORD}
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    container_name: ${PROJECT_NAME}-app
    environment:
      PROJECT_NAME: ${PROJECT_NAME}
      ENVIRONMENT: ${ENVIRONMENT}
      BUILD_VERSION: ${BUILD_VERSION}
      SOME_API_KEY: ${SOME_API_KEY}
      LOG_DIR: ${LOG_DIR}
      LOG_NAME: ${LOG_NAME}
      LOG_ROTATE_NAME: ${LOG_ROTATE_NAME}
      LOG_LEVEL: ${LOG_LEVEL}
      FASTAPI_HOST: "0.0.0.0"
      FASTAPI_PORT: 8000
      FASTAPI_WORKERS: ${FASTAPI_WORKERS}
      REDIS_URL: "redis://:${REDIS_PASSWORD}@redis:6379/0"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS}
      DEBUG: ${DEBUG}
    ports:
      - "${FASTAPI_PORT}:8000"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python3 -c 'import urllib.request; urllib.request.urlopen(\"http://127.0.0.1:8000/health\")'"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

volumes:
  redis_data:
